
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

#für pywal:
source = ~/.cache/wal/colors-hyprland.conf

################
### MONITORS ###
################

monitor=eDP-1, 1920x1080, 0x0, 1
monitor=HDMI-A-1, 1920x1080@144, 1920x-500, 1

###################
### MY PROGRAMS ###
###################

$terminal = alacritty
$fileManager = nautilus
$menu = wofi --show drun
$screenshot = hyprshot -m window
$screenshot_region = hyprshot -m region

#################
### AUTOSTART ###
#################

#Basic stuff am anfang amal
exec-once = waybar & swaync & hypridle & waypaper
exec-once = waypaper --restore
exec-once = hyprctl setcursor BibataD 25


#############################
### ENVIRONMENT VARIABLES ###
#############################


env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#testing für nautilus shitter
env = XDG_CURRENT_DESKTOP,Hyprland
env = GTK_USE_PORTAL,1
env = GDK_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland



###################
### PERMISSIONS ###
###################


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    	col.active_border = $color1 $color1
	col.inactive_border = $background

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)#war am anfang (1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1
    
    	#paar infos: 
	#popin: wie groß des window is wenns erscheint 		0% geht von mitte bis ganz groß


	       #NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     1,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     1,     easeOutQuint
    animation = windowsIn,     1,     7,     easeOutQuint, popin 10% # def: 4.1 easeOutQuint popin 87
    animation = windowsOut,    1,     7,     easeOutQuint, popin 10% # def: 1.49 linear popin 87
    animation = windowsMove,   1,     5,     easeOutQuint, popin 10%
    animation = fadeIn,        1,     1,     almostLinear	#def: 1.73 almostLinear
    animation = fadeOut,       1,     1.5,   almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade		#4 easeOutQ fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear		#def: 1.79 almLin
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1,     almostLinear, slide	#def: 1.94 almLin fade
    animation = workspacesIn,  1,     2.2,   almostLinear, slide	#def: 1.21 almostLin fade
    animation = workspacesOut, 1,     2.2,   almostLinear, slide	#def: 1.94 almLin fade
    animation = zoomFactor,    1,     7,     quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
#TBC

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

input {
    #kb_layout = de
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    accel_profile = flat
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    
    #cs2 workaround bre
    #follow mouse auf 0 stellen
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, W, exec, waypaper

bind = $mainMod, R, exec, swaync-client -t

#meine eigenen jetzt
bind = $mainMod, F12, exec, $screenshot
bind = $mainMod SHIFT, P, exec, $screenshot_region
bind = $mainMod, L, exec, /home/tobias/.config/hypr/scripts/lockscreen.sh


# Window Focus
bind = $mainMod SHIFT, h, movefocus, l
bind = $mainMod SHIFT, l, movefocus, r
bind = $mainMod SHIFT, k, movefocus, u
bind = $mainMod SHIFT, j, movefocus, d

# Switch Workspaces dings
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Window von Workspace X zu Workspace Y
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# idk was aber es geht halt 
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Durch Workspaces scrollen
bind = $mainMod SHIFT, right, workspace, e+1
bind = $mainMod SHIFT, left, workspace, e-1

# Resizen von Windows mit right mouse button
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop Keys 
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Media player workaround keydinga
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# WORKSPACE RULES gehn irgendwie ned weil komisch
#workspace = 1, m[eDP-1]
#workspace = 2, m[eDP-1]
#workspace = 3, m[HDMI-A-1]
#workspace = 4, m[HDMI-A-1]

# WINDOW RULES 
# KITTY
windowrule = tile on,match:class kitty

# WAYPAPER
windowrule = float on, size 900 600, match:class waypaper

# YTMUSIC
windowrule = float on, size 500 500, workspace 2, opacity 0.9, match:class com.github.th_ch.youtube_music

# VESKTOP
windowrule = opacity 0.9, match:class ^(vesktop|Vesktop)$

# NAUTILUS
windowrule = opacity 0.9, match:class ^(org.gnome.Nautilus)$

# ALACRITTY
windowrule = opacity 0.8, match:class ^(Alacritty)$

# STEAM
windowrule = opacity 0.9, match:class ^(steam)$

# Dont delete sonst brickt alles lol
windowrule = suppress_event maximize,match:class .*

# wierd dragging bug fix
windowrule = no_focus on,match:class ^$,match:title ^$,match:xwayland 1,match:float 1,match:fullscreen 0,match:pin 0


cursor {
    no_hardware_cursors = true
    use_cpu_buffer = true
}

